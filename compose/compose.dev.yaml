
version: '3.9'

# ==========================
# Development Overrides for compose.yaml
# ==========================
# Run with: docker compose -f compose.yaml -f compose.dev.yaml up
# ==========================

services:
  frontend:
    user: "1001:1001" # التأكيد على تشغيل الخدمة بنفس الـ ID المعرف في الـ Dockerfile
    volumes:
      # ربط ملفات الكونفيج من فولدر الـ frontend مباشرة
      - ../apps/bonicare-frontend/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ../apps/bonicare-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      
      # ربط ملفات الـ build فقط (بدون الـ node_modules)
      - ../apps/bonicare-frontend/dist/bonicare-frontend/browser:/usr/share/nginx/html:ro
    restart: unless-stopped

  backend:
    volumes:
      - ../apps/bonicare-backend:/app
      - ../apps/bonicare-backend/node_modules:/app/node_modules
      - ../apps/bonicare-backend/uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - DEBUG=*
    restart: unless-stopped

  ai-service:
    volumes:
      - ../apps/ai-service:/app
      - ../apps/ai-service/models:/app/models
    restart: unless-stopped

  webrtc:
    volumes:
      - ../apps/webrtc:/app
      - ../apps/webrtc/node_modules:/app/node_modules
    restart: unless-stopped

  mongo:
    restart: unless-stopped

  redis:
    restart: unless-stopped
