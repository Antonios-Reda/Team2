apiVersion: apps/v1
kind: Deployment
metadata:
  name: webrtc
  namespace: bonicare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webrtc
  template:
    metadata:
      labels:
        app: webrtc
    spec:
      containers:
      - name: webrtc
        image: compose-webrtc
        imagePullPolicy: Never
        ports:
        - containerPort: 5002
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webrtc-service
  namespace: bonicare
spec:
  type: NodePort
  selector:
    app: webrtc
  ports:
  - port: 5002
    targetPort: 5002
    nodePort: 30502
    protocol: TCP