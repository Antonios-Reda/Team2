apiVersion: v1
kind: ConfigMap
metadata:
  name: bonicare-config
  namespace: bonicare
data:
  NODE_ENV: "development"
  PORT: "3000"
  MONGO_URI: "mongodb://mongo-service:27017/bonicare"
  REDIS_URL: "redis://redis-service:6379"
  AI_SERVICE_URL: "http://ai-service:8000"
  WEBRTC_URL: "http://webrtc-service:5002"