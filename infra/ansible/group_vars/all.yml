---
# Global Environment Configuration
environment_tier: production
base_deploy_dir: "/opt/bonicare"
app_domain: "bonicare.app"

# Service Specifications (Shared by Docker Compose & K8s)
services:
  backend:
    container_port: 3000
    health_endpoint: "/health"
  frontend:
    container_port: 80
    health_endpoint: "/"
  ai:
    container_port: 8000
    health_endpoint: "/status"
  webrtc:
    container_port: 5000
    health_endpoint: "/socket.io"

# Global Security
deployment_user: deploy
ssh_port: 2222 # Hardened SSH Port