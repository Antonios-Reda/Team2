---
# Global Project Configuration
project_name: bonicare
deployment_user: deploy
base_deploy_dir: /opt/{{ project_name }}

# Docker Registry Configuration (Utilized by Jenkins deployment pipelines)
docker_registry: docker.io
docker_namespace: team2
docker_network_name: bonicare_net

# Database and Caching Internal Container Networking
db_host: mongodb
db_port: 27017
redis_host: redis
redis_port: 6379

# Microservices Definitions and Container Ports
services:
  backend:
    name: bonicare-backend
    container_port: 3000
    health_endpoint: /health
  frontend:
    name: bonicare-frontend
    container_port: 80
  ai:
    name: ai-service
    container_port: 8000
    health_endpoint: /health
  webrtc:
    name: webrtc-signaling
    container_port: 3001
    health_endpoint: /health

# Standardized Container Logging Constraints
docker_logging_driver: json-file
docker_logging_max_size: 50m
docker_logging_max_file: 3