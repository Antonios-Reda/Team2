---
# Default list of packages required for Docker ecosystem and deployment operations
docker_required_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

# Target packages to install for Docker Engine and orchestration tools
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Fallback deployment user if not defined in global group_vars
deployment_user_fallback: deploy

# Default logging configuration fallback
docker_log_driver_fallback: json-file