---
# Container Image Tags (Pinned for Production Stability)
prometheus_version: "v2.51.0"
grafana_version: "10.4.0"
loki_version: "2.9.4"
tempo_version: "2.4.0"
alertmanager_version: "v0.27.0"
node_exporter_version: "v1.7.0"
cadvisor_version: "v0.49.0"

# Data Retention Policies
prometheus_retention_time: "15d"
loki_retention_period: "14d"

# Default Grafana Admin Credentials (Should be overridden in Vault/Extra Vars)
grafana_admin_user: "admin"
grafana_admin_password: "admin_secure_password_replace_me"