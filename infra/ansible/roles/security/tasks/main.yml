---
- name: Set system timezone for accurate audit and application logs
  community.general.timezone:
    name: "{{ security_timezone }}"
  notify: Restart Chrony

- name: Install enterprise security and audit packages
  ansible.builtin.apt:
    name: "{{ security_packages }}"
    state: present
    update_cache: true

- name: Ensure Chrony (NTP) is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Deploy strict SSH daemon configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Deploy Kernel sysctl hardening parameters
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/99-security-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply Sysctl

- name: Configure Unattended Upgrades for automatic security patching
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'

# UFW Firewall Configuration
- name: Set UFW default deny policies
  community.general.ufw:
    default: deny
    direction: "{{ item }}"
  loop:
    - incoming
    - outgoing

- name: Allow essential outbound traffic via UFW
  community.general.ufw:
    rule: allow
    direction: outgoing

- name: Allow specific inbound TCP application ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ security_allowed_tcp_ports }}"

- name: Allow specific inbound UDP application ports (e.g., WebRTC)
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ security_allowed_udp_ports }}"
  when: security_allowed_udp_ports | length > 0

- name: Ensure UFW interoperability with Docker (Allow container forwarding)
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: Reload UFW

- name: Enable UFW natively
  community.general.ufw:
    state: enabled
    logging: "on"

- name: Ensure Fail2Ban is active to prevent brute-force attacks
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Ensure Auditd is actively logging system events
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true