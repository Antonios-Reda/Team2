# ==========================
# BoniCare Frontend Nginx Configuration
# ==========================
# Optimized for Angular SPA with caching, compression, and security headers

# Upstream backend for API proxying (optional, can be used if needed)
upstream backend {
    server backend:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Root directory for Angular build output
    root /usr/share/nginx/html;
    
    # ==========================
    # Logging Configuration
    # ==========================
access_log /tmp/nginx-access.log combined buffer=32k flush=5s;    error_log /tmp/nginx-error.log warn;
    
    # ==========================
    # Security Headers
    # ==========================
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'self';" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ==========================
    # Gzip Compression
    # ==========================
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss application/xml image/svg+xml;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 1000;
    gzip_disable "msie6";
    
    # ==========================
    # Health Check Endpoint (for Docker health checks)
    # ==========================
    location /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }
    
    # ==========================
    # API Proxy (if backend is in same network)
    # ==========================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # ==========================
    # WebSocket Proxy (for Socket.IO)
    # ==========================
    location /socket.io {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    
    # ==========================
    # Static Assets (1 year cache)
    # ==========================
    location ~* ^/assets/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Cache buster for versioned JS/CSS (Angular typically does this)
    location ~* ^/.*\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # ==========================
    # HTML Files (no-cache, revalidate)
    # ==========================
    location ~* \.html?$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        add_header Pragma "public";
    }
    
    # ==========================
    # SPA Routing - Fallback to index.html
    # ==========================
    # This ensures that all non-existent routes are handled by Angular's client-side router
    # MUST be last location block
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # ==========================
    # Deny access to sensitive files
    # ==========================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ==========================
    # Client request body size limit
    # ==========================
    client_max_body_size 10M;
}
